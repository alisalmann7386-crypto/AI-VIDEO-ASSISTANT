name: Streamlit deployment checks

on:
  push:
    branches: [main, fix/streamlit-cloud-deployment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile all Python source
        run: python -m compileall -q app.py main.py core utils tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
